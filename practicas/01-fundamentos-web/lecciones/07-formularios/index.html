<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Formularios</title></head><body><h1>Formulario de registro</h1><p>Demostración local: no envía información a ningún servidor.</p><form id='registro'><label>Nombre <input name='nombre' required></label><p><label>Edad <input type='number' name='edad' min='18' max='100' required></label></p><p><label>Experiencia <input type='range' min='0' max='15' step='0.5' value='5' id='nivel'></label> <output id='rango'>5</output></p><p><label>Comentario <textarea name='comentario'></textarea></label></p><fieldset><legend>Modalidad</legend><label><input type='radio' name='modalidad' value='presencial'>Presencial</label><label><input type='radio' name='modalidad' value='virtual'>Virtual</label></fieldset><fieldset><legend>Pasatiempos</legend><label><input type='checkbox' name='pasatiempos' value='tenis'>Tenis</label><label><input type='checkbox' name='pasatiempos' value='natacion'>Natación</label></fieldset><p><label>Ciudad <select name='ciudad'><option>Armenia</option><option>Medellín</option><option>Bogotá</option></select></label></p><button type='submit'>Validar formulario</button> <button type='reset'>Limpiar</button></form><p id='mensaje' aria-live='polite'></p><script>const n=document.querySelector('#nivel');n.addEventListener('input',()=>document.querySelector('#rango').value=n.value);document.querySelector('#registro').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#mensaje').textContent='Validación correcta. No se enviaron datos.'})</script></body></html>
